name: Release

# Crea una release con los paquetes para Firefox y Chromium.
# - Manualmente: Actions → Release → Run workflow (usa la versión de manifest.json).
# - O al subir una etiqueta vX.Y.Z.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar versión
        id: ver
        run: |
          FF=$(node -p "require('./manifest.json').version")
          CR=$(node -p "require('./platform/chromium/manifest.json').version")
          if [ "$FF" != "$CR" ]; then
            echo "::error::Versiones distintas: Firefox $FF, Chromium $CR"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$FF" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión $FF de los manifiestos"; exit 1
          fi
          echo "version=$FF" >> "$GITHUB_OUTPUT"

      - name: Generar paquetes
        run: |
          node build.mjs
          V=${{ steps.ver.outputs.version }}
          mv dist/firefox.zip  "dist/gog-regional-prices-$V-firefox.zip"
          mv dist/chromium.zip "dist/gog-regional-prices-$V-chromium.zip"
          ls -l dist/*.zip

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.ver.outputs.version }}
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "::error::La release v$V ya existe"; exit 1
          fi
          gh release create "v$V" dist/gog-regional-prices-$V-*.zip \
            --target "$GITHUB_SHA" --title "v$V" --generate-notes
